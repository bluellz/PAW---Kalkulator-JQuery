<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator jQuery</title>
<style>
  :root {
    --bg: #e9edea;
    --body: #fbfcfb;
    --ink: #1c2826;
    --key: #ffffff;
    --key-line: #c5cfcb;
    --op: #d3e2de;
    --accent: #1f6f6b;
    --accent-ink: #ffffff;
    --err: #a3341f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .calc {
    width: min(92vw, 340px);
    padding: 20px;
    background: var(--body);
    border: 1px solid var(--key-line);
    border-radius: 14px;
  }
  .identity {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 0 2px 14px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .identity span:last-child { text-align: right; }
  .display {
    min-height: 64px;
    margin-bottom: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: #fff;
    font-family: Consolas, "Courier New", monospace;
    font-size: 1.5rem;
    overflow-x: auto;
    white-space: nowrap;
  }
  .display.error { color: var(--err); font-size: 1.05rem; }
  .pad {
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 10px;
  }
  .digits, .ops {
    display: grid;
    gap: 10px;
  }
  .digits { grid-template-columns: repeat(3, 1fr); }
  .ops { grid-template-columns: 1fr; grid-auto-rows: 1fr; }
  button {
    height: 52px;
    border: 1px solid var(--key-line);
    border-radius: 8px;
    background: var(--key);
    color: var(--ink);
    font: inherit;
    font-size: 1.2rem;
    cursor: pointer;
  }
  button:hover { background: #f0f5f3; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ops button { background: var(--op); font-weight: 600; }
  .ops button:hover { background: #c3d7d2; }
  .clear { color: var(--err); }
  .equals {
    width: 100%;
    margin-top: 10px;
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .equals:hover { background: #185a57; }
</style>
</head>
<body>

<main class="calc">
  <div class="identity">
    <span id="nim"></span>
    <span id="nama"></span>
  </div>

  <div class="display" id="display" aria-live="polite">0</div>

  <div class="pad">
    <div class="digits">
      <button class="digit">1</button>
      <button class="digit">2</button>
      <button class="digit">3</button>
      <button class="digit">4</button>
      <button class="digit">5</button>
      <button class="digit">6</button>
      <button class="digit">7</button>
      <button class="digit">8</button>
      <button class="digit">9</button>
      <button class="clear" id="clear" aria-label="Hapus semua">C</button>
      <button class="digit">0</button>
      <button id="backspace" aria-label="Hapus satu karakter">⌫</button>
    </div>
    <div class="ops">
      <button class="op" data-op="+">+</button>
      <button class="op" data-op="-">−</button>
      <button class="op" data-op="*">×</button>
      <button class="op" data-op="/">÷</button>
    </div>
  </div>

  <button class="equals" id="equals">=</button>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
$(function () {

  // Data Mahasiswa
  var NIM  = "255150700111018";
  var NAMA = "Cici Ramadhani";


  var symbol = { "+": "+", "-": "−", "*": "×", "/": "÷" };

  // state kalkulator
  var a = "";        // angka pertama
  var op = "";       // operator
  var b = "";        // angka kedua
  var done = false;  // true setelah tombol "=" ditekan
  var result = "";

  $("#nim").text(NIM);
  $("#nama").text(NAMA);

  function hitung(x, operator, y) {
    x = parseFloat(x);
    y = parseFloat(y);
    switch (operator) {
      case "+": return x + y;
      case "-": return x - y;
      case "*": return x * y;
      case "/":
        if (y === 0) return null;   // pembagian dengan nol
        return x / y;
    }
  }

  function rapikan(n) {
    // buang error floating point, mis. 0.1 + 0.2
    return String(parseFloat(n.toPrecision(12)));
  }

  function tampil() {
    var teks = a;
    if (op) teks += " " + symbol[op];
    if (b)  teks += " " + b;
    if (done) teks += " = " + result;
    $("#display").removeClass("error").text(teks || "0");
  }

  function error(pesan) {
    a = ""; op = ""; b = ""; done = false; result = "";
    $("#display").addClass("error").text(pesan);
  }

  function reset() {
    a = ""; op = ""; b = ""; done = false; result = "";
    tampil();
  }

  // tombol angka
  $(".digit").on("click", function () {
    var d = $(this).text();
    if (done) reset();
    if (!op) {
      a = (a === "0") ? d : a + d;
    } else {
      b = (b === "0") ? d : b + d;
    }
    tampil();
  });

  // tombol operator + - * /
  $(".op").on("click", function () {
    var pilihan = $(this).data("op");

    if (done) {               // lanjutkan dari hasil sebelumnya
      a = result; b = ""; done = false;
    }
    if (a === "") return;     // belum ada angka pertama

    if (op && b !== "") {     // contoh: 2 + 3 lalu tekan * -> hitung dulu
      var antara = hitung(a, op, b);
      if (antara === null) { error("Tidak bisa dibagi 0"); return; }
      a = rapikan(antara);
      b = "";
    }
    op = pilihan;
    tampil();
  });

  // tombol =
  $("#equals").on("click", function () {
    if (done || a === "" || op === "" || b === "") return;
    var hasil = hitung(a, op, b);
    if (hasil === null) { error("Tidak bisa dibagi 0"); return; }
    result = rapikan(hasil);
    done = true;
    tampil();
  });

  // tombol C
  $("#clear").on("click", reset);

  // tombol backspace: hapus karakter terakhir
  $("#backspace").on("click", function () {
    if (done) { reset(); return; }   // setelah "=", backspace mengosongkan layar
    if (b !== "")      b = b.slice(0, -1);
    else if (op !== "") op = "";
    else               a = a.slice(0, -1);
    tampil();
  });

});
</script>
</body>
</html>
